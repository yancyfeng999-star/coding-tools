  - path: Apps/Mac/scripts/notarize-release.sh
    action: rewrite
    summary: |
      - notarytool submit ZIP + DMG（--wait）
      - stapler staple
      - stapler validate
      - spctl --assess
    verification: "bash -n OK；--help 输出正确"

  - path: Apps/Mac/scripts/generate-appcast.sh
    action: rewrite
    summary: |
      - 调用 Sparkle 的 generate_appcast（带 EdDSA 签名）
      - 同步到 docs/appcast.xml 和仓库根 appcast.xml
    verification: "bash -n OK；--help 输出正确"

  - path: Apps/Mac/scripts/release.sh
    action: rewrite
    summary: |
      完整编排器（7 步 + SKIP_PUBLISH 安全路径）：
        1. 跑测试
        2. 构建（同时注入 SUPublicEDKey，trap 保证失败时还原）
        3. 打包（DMG + ZIP + SHA-256）
        4. 签名（Developer ID + Hardened Runtime）
        5. 公证（notarytool + Staple）
        6. 生成 Appcast（EdDSA 签名）
        7. git commit + tag + push + gh release create
      --help / --dry-run / SKIP_PUBLISH=1 / DRY_RUN=1 全部支持
    verification: |
      - bash -n OK
      - --help 输出完整
      - --dry-run 列出 7 步但不执行
      - DRY_RUN=1 SKIP_PUBLISH=1 仅打印 [DRY] 标记，安全退出

  - path: Apps/Mac/scripts/verify-appcast.sh
    action: create
    summary: "验证 appcast.xml well-formed + sparkle:edSignature 存在"
    verification: "bash -n OK；--help 输出正确"

