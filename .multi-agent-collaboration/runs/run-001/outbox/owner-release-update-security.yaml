    verification: "bash -n OK；bump-version.sh --check 输出当前 v0.0.0"

  - path: Apps/Mac/scripts/package-release.sh
    action: rewrite
    summary: |
      - Release build
      - DMG：hdiutil 流程 + /Applications 快捷方式
      - ZIP：ditto 给 Sparkle in-app update
      - SHA-256 校验和
      - 如 SPARKLE_PRIVATE_KEY 设置，sign_update 给 ZIP 加 .sig
    verification: "bash -n OK"

  - path: Apps/Mac/scripts/sign-release.sh
    action: rewrite
    summary: |
      - codesign --deep --force --options runtime --timestamp
      - codesign --verify --strict --verbose=2
      - 提取 Team ID
      - spctl --assess 评估（best-effort，因未 notarize）
