name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEMES: "DomainTests CatalogTests InstallerTests ManifestSecurityTests UpdatesTests"

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install Tuist
        run: |
          brew tap tuist/tuist
          brew install tuist
          tuist version

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            Apps/Mac/Tuist/.build
            Apps/Mac/.tuist-generated
            ~/Library/Caches/tuist
          key: ${{ runner.os }}-tuist-${{ hashFiles('Apps/Mac/Project.swift', 'Apps/Mac/Tuist/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: Apps/Mac/build/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('Apps/Mac/Project.swift', 'Apps/Mac/Sources/**/*.swift', 'Apps/Mac/Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-derived-

      - name: Tuist install
        run: cd Apps/Mac && tuist install

      - name: Tuist generate
        run: cd Apps/Mac && tuist generate

      - name: Build
        run: cd Apps/Mac && SKIP_TUIST_INSTALL=1 ./scripts/build.sh

      - name: Test
        run: cd Apps/Mac && SCHEMES="$SCHEMES" ./scripts/run-tests.sh
        env:
          SKIP_TUIST_INSTALL: "1"
