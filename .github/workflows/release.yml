name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize, Publish
    runs-on: macos-14
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install Tuist
        run: |
          brew tap tuist/tuist
          brew install tuist

      - name: Import Signing Certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Set Up Sparkle Keys
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p $RUNNER_TEMP/sparkle
          echo "$SPARKLE_PRIVATE_KEY" > $RUNNER_TEMP/sparkle/ed25519_private_key
          echo "SPARKLE_PRIVATE_KEY=$RUNNER_TEMP/sparkle/ed25519_private_key" >> $GITHUB_ENV

      - name: Build & Release
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          KEYCHAIN_PROFILE: ${{ secrets.KEYCHAIN_PROFILE }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cd Apps/Mac
          ./scripts/release.sh

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain-db || true
